<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nader Sghir</title>
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, sans-serif; padding: 0 16px; }
    main { max-width: 40rem; text-align: center; }
    h1 { margin: 0 0 .5rem; font-size: 2.25rem; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Nader Sghir</h1>
    <p>Site coming soon.</p>
  </main>
</body>
</html>
